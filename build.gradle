tasks.named('check') {
    dependsOn test, jacocoTestReport, jacocoTestCoverageVerification, codenarcMain
    outputs.upToDateWhen { false }

    doFirst {
        println "  RUNNING COMPREHENSIVE CHECK (FULL TEST SUITE)"
        println "=" * 120
        println "  Includes: clean, test, codenarcMain, jacocoTestReport, jacocoTestCoverageVerification, testSummary"
        println "  Rerun Tasks: Enabled"
        println "=" * 120
    }

    doLast {
        println "\nBuild check completed! Comprehensive test summary will be displayed next."
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            // from components.java
            // publish shadowJar as-is (it already has classifier "all")
            artifact(tasks.named("shadowJar"))
            pom {
                name.set("morpheus-harvester-plugin")
                description.set("Harvester Plugin for Morpheus")
                url.set("https://github.com/HPE-EMU/morpheus-harvester-plugin")
            }
        }
    }
}

tasks.register("uploadToArtifactory") {
    dependsOn tasks.shadowJar
    dependsOn tasks.jar

    doLast {
        def artifactId = "morpheus-harvester-plugin"
        def jarFile = tasks.named("jar").get().archiveFile.get().asFile
        def shadowFile = tasks.named("shadowJar").get().archiveFile.get().asFile
        // --- SNAPSHOT handling ---
        def uploadBaseVersion = project.ext.baseVersion
        def timestampedVersion = project.ext.finalVersion

        // --- Generate a minimal POM manually ---
        def pomFile = file("${buildDir}/publications/mavenJava/${artifactId}-${uploadBaseVersion}.pom")
        pomFile.parentFile.mkdirs()
        pomFile.text = """<project xmlns="http://maven.apache.org/POM/4.0.0"
          xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
          xsi:schemaLocation="http://maven.apache.org/POM/4.0.0
          http://maven.apache.org/xsd/maven-4.0.0.xsd">
          <modelVersion>4.0.0</modelVersion>
          <groupId>com.hpe.ibm</groupId>
          <artifactId>${artifactId}</artifactId>
          <version>${uploadBaseVersion}</version>
          <packaging>jar</packaging>
          <name>${artifactId}</name>
          <description>Harvester for Morpheus</description>
          <url>https://github.com/HPE-EMU/morpheus-harvester-plugin</url>
        </project>"""

        def repoKey = "morpheus-plugins"
        def buildName = artifactId
        def buildNumber = System.getenv("GITHUB_RUN_NUMBER") ?: System.currentTimeMillis().toString()
        def versionStr = project.version.toString()
        def targetProps = "commit_id=${gitCommitId};branch=${gitBranchName}"

        def artUrl = System.getenv("ARTIFACTORY_URL")
        def artUser = System.getenv("ARTIFACTORY_USER")
        def artPass = System.getenv("ARTIFACTORY_PASSWORD")
        if (!artUrl || !artUser || !artPass) {
            throw new GradleException("Artifactory credentials (URL, USER, PASSWORD) must be set in environment")
        }

	def isSnapshotVersion = uploadBaseVersion.endsWith("-SNAPSHOT")
	def tsFolder = new SimpleDateFormat("yyyyMMdd.HHmmss").format(new Date())

        // --- Always use SNAPSHOT folder, but timestamped file names ---
	def targetDir = isSnapshotVersion
    	    ? "${repoKey}/com/hpe/morpheus/harvester/${artifactId}/${uploadBaseVersion}"
	    : "${repoKey}/com/hpe/morpheus/harvester/${artifactId}/${uploadBaseVersion}/${tsFolder}"

        // --- Call JFrog CLI directly (no shell) ---
        exec {
            commandLine "jfrog", "rt", "bce", buildName, buildNumber
        }
        exec {
            commandLine "jfrog", "rt", "bag", buildName, buildNumber
        }
        exec {
            commandLine "jfrog", "rt", "u",
                jarFile.absolutePath,
                "${targetDir}/${artifactId}-${timestampedVersion}.jar",
                "--url=${artUrl}",
                "--user=${artUser}",
                "--password=${artPass}",
                "--target-props=${targetProps}",
                "--build-name=${buildName}",
                "--build-number=${buildNumber}"
        }
        exec {
            commandLine "jfrog", "rt", "u",
                shadowFile.absolutePath,
                "${targetDir}/${artifactId}-${timestampedVersion}-all.jar",
                "--url=${artUrl}",
                "--user=${artUser}",
                "--password=${artPass}",
                "--target-props=${targetProps}",
                "--build-name=${buildName}",
                "--build-number=${buildNumber}"
        }
        exec {
            commandLine "jfrog", "rt", "u",
                pomFile.absolutePath,
                "${targetDir}/${artifactId}-${timestampedVersion}.pom",
                "--url=${artUrl}",
                "--user=${artUser}",
                "--password=${artPass}",
                "--target-props=${targetProps}",
                "--build-name=${buildName}",
                "--build-number=${buildNumber}"
        }
        exec {
            commandLine "jfrog", "rt", "bp",
                buildName, buildNumber,
                "--url=${artUrl}",
                "--user=${artUser}",
                "--password=${artPass}"
        }
    }
    // prevent Gradle warning
    outputs.upToDateWhen { false }
}
