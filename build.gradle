// Returns the trimmed output of a git command, or null when git or a commit is unavailable
// (e.g. building from a zip or inside a container without the repository history)
String gitOutput(List<String> cmd) {
	try {
		def proc = cmd.execute()
		def out = proc.text.trim()
		proc.waitFor()
		return proc.exitValue() == 0 && out ? out : null
	} catch (Exception ignored) {
		return null
	}
}
ext {
    baseVersion = project.version.toString()
    if (baseVersion.endsWith("-SNAPSHOT")) {
		def ts = new SimpleDateFormat("yyyyMMdd.HHmmss").format(new Date())
        	def commitHash = gitOutput(['git', 'rev-parse', '--short', 'HEAD']) ?: 'local'
        	def buildNum = System.getenv("GITHUB_RUN_NUMBER") ?: "1"
        	finalVersion = "${baseVersion.replace('-SNAPSHOT', '')}-${ts}-${buildNum}-${commitHash}"
    } else {
        finalVersion = baseVersion
    }
}
version = finalVersion
ext.isReleaseVersion = !version.endsWith("SNAPSHOT")

ext.minLineCoverage = (project.findProperty('minLineCoverage') ?: 80).toBigDecimal()

