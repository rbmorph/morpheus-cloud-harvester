// ANSI Color Constants for enhanced console output (kept simple)
ext.colors = [
    RESET: "\u001B[0m",
    GREEN: "\u001B[32m",
    RED: "\u001B[31m",
    YELLOW: "\u001B[33m",
    ORANGE: "\u001B[38;5;208m",
    BOLD: "\u001B[1m"
]

/**
 * Configures XML parser with security features to prevent XXE attacks
 */
static def configureXmlParser() {
    def parser = new XmlSlurper()
    parser.setFeature("http://apache.org/xml/features/disallow-doctype-decl", false)
    parser.setFeature("http://xml.org/sax/features/external-general-entities", false)
    parser.setFeature("http://xml.org/sax/features/external-parameter-entities", false)
    parser.setFeature("http://apache.org/xml/features/nonvalidating/load-dtd-grammar", false)
    parser.setFeature("http://apache.org/xml/features/nonvalidating/load-external-dtd", false)
    parser.setProperty("http://javax.xml.XMLConstants/property/accessExternalDTD", "")
    return parser
}

/**
 * Parses Jacoco XML report to extract line coverage data
 */
def parseCoverageFromXml(xmlReport) {
    def coverageData = [line: null]

    if (xmlReport.exists()) {
        def parser = configureXmlParser()
        def jacoco = parser.parse(xmlReport)
        jacoco.counter.each { counter ->
            def type = counter.@type.toString()
            def missed = counter.@missed.toString() as Integer
            def covered = counter.@covered.toString() as Integer
            def total = missed + covered
            def percentage = total > 0 ? Math.round((covered * 100.0) / total * 10) / 10 : 0.0

            if (type == 'LINE') {
                coverageData.line = percentage
            }
        }
    }
    return coverageData
}

/**
 * Displays code coverage results with colored output
 */
def displayCoverageResults(buildDir, displayIfMissing = true) {
    def xmlReport = file("${buildDir}/reports/jacoco/test/jacocoTestReport.xml")
    def htmlReport = file("${buildDir}/reports/jacoco/test/html/index.html")
    def coverageData = parseCoverageFromXml(xmlReport)

    if (xmlReport.exists() || htmlReport.exists() || displayIfMissing) {
        println "  Thresholds: Line ${minLineCoverage}%"

        def formatCoverageMetric = { actual, threshold, label ->
            def passed = (actual != null && threshold != null && actual >= threshold)
            def color = passed ? colors.GREEN : colors.RED
            def status = passed ? 'OK' : 'X'
            return "  ${label}: ${actual}% ${color}${status}${colors.RESET}"
        }

        if (coverageData.line != null) {
            println formatCoverageMetric(coverageData.line, minLineCoverage, "Line Coverage       ")
        }

        println "=" * 120
        println ""
    }

    return coverageData
}

/**
 * Parses CodeNarc XML/HTML reports to extract violation data
 */
def parseCodenarcReport(buildDir) {
    def codenarcData = [
        totalViolations: 0,
        priority1: 0,
        priority2: 0,
        priority3: 0,
        filesAnalyzed: 0,
        reportExists: false,
        fileViolations: [:]
    ]

    def codenarcHtml = file("${buildDir}/reports/codenarc/main.html")
    def codenarcXml = file("${buildDir}/reports/codenarc/main.xml")

    if (codenarcHtml.exists()) {
        codenarcData.reportExists = true

        if (codenarcXml.exists()) {
            try {
                def parser = configureXmlParser()
                def codenarc = parser.parse(codenarcXml)

                // Get files analyzed count
                def packageSummary = codenarc.PackageSummary
                if (packageSummary.size() > 0) {
                    codenarcData.filesAnalyzed = (packageSummary[0].@totalFiles.toString() ?: "0") as Integer
                } else {
                    def packages = codenarc.Package
                    if (packages.size() > 0) {
                        codenarcData.filesAnalyzed = (packages[0].@totalFiles.toString() ?: "0") as Integer
                    }
                }

                // Parse violations by file
                codenarc.Package.each { pkg ->
                    def pkgPath = pkg.@path?.toString() ?: ""

                    pkg.File.each { file ->
                        codenarcData.filesAnalyzed++
                        def fileName = file.@name?.toString() ?: "Unknown"
                        def filePath = pkgPath ? "${pkgPath}/${fileName}" : fileName

                        def fileViolations = [total: 0, priority1: 0, priority2: 0, priority3: 0]

                        file.Violation.each { violation ->
                            codenarcData.totalViolations++
                            fileViolations.total++

                            def priority = violation.@priority?.toString() ?: "3"
                            switch(priority) {
                                case '1':
                                    codenarcData.priority1++
                                    fileViolations.priority1++
                                    break
                                case '2':
                                    codenarcData.priority2++
                                    fileViolations.priority2++
                                    break
                                default:
                                    codenarcData.priority3++
                                    fileViolations.priority3++
                            }
                        }

                        if (fileViolations.total > 0) {
                            codenarcData.fileViolations[filePath] = fileViolations
                        }
                    }
                }
            } catch (Exception ignored) {
                codenarcData.totalViolations = -1 // Indicates XML parsing failed
            }
        }
    }

    return codenarcData
}

/**
 * Displays CodeNarc analysis results with colored output and file-level details
 */
def displayCodenarcResults(buildDir) {
    def codenarcData = parseCodenarcReport(buildDir)

    if (codenarcData.reportExists) {
        if (codenarcData.totalViolations >= 0) {
            println "  Files Analyzed:          ${codenarcData.filesAnalyzed}"
            //println "  Total Violations:        ${codenarcData.totalViolations}"
            println "  Total Violations:        ${codenarcData.priority1 + codenarcData.priority2}"

            if (codenarcData.totalViolations > 0) {
                // Inline color usage: P1 red, P2 orange, P3 yellow if >0 else green OK marker
                println "  Priority 1 (Critical):   " + (codenarcData.priority1 > 0 ? "${colors.RED}${codenarcData.priority1}${colors.RESET}" : "${colors.GREEN}0${colors.RESET}")
                println "  Priority 2 (High):       " + (codenarcData.priority2 > 0 ? "${colors.ORANGE}${codenarcData.priority2}${colors.RESET}" : "${colors.GREEN}0${colors.RESET}")
                //println "  Priority 3 (Medium):     " + (codenarcData.priority3 > 0 ? "${colors.YELLOW}${codenarcData.priority3}${colors.RESET}" : "${colors.GREEN}0${colors.RESET}")

                if (codenarcData.priority1 > 0) {
                    println "  Status:                  ${colors.BOLD}${colors.RED}CRITICAL VIOLATIONS FOUND${colors.RESET}"
                } else if (codenarcData.priority2 > 0) {
                    println "  Status:                  ${colors.BOLD}${colors.ORANGE}HIGH PRIORITY VIOLATIONS FOUND${colors.RESET}"
                }/* else if (codenarcData.priority3 > 0) {
                    println "  Status:                  ${colors.BOLD}${colors.YELLOW}MEDIUM PRIORITY VIOLATIONS FOUND${colors.RESET}"
                } */else {
                    println "  Status:                  ${colors.BOLD}${colors.GREEN}NO VIOLATIONS FOUND${colors.RESET}"
                }

                if (codenarcData.fileViolations.size() > 0) {
                    println ""
                    println "-" * 120

                    // Fixed widths
                    int fileWidth = 45
                    int metricWidth = 8 // room for 5-6 digits

                    // Left-align values with trailing spaces (avoids right clipping); auto-expands if longer
                    def formatMetric = { int value, int width, String colorCode = null, boolean bold = false ->
                        String raw = value.toString()
                        String colored = colorCode ? (bold ? colors.BOLD + colorCode + raw + colors.RESET : colorCode + raw + colors.RESET) : (bold ? colors.BOLD + raw + colors.RESET : raw)
                        if(raw.length() >= width) {
                            return colored + ' ' // ensure separator spacing if overflow
                        }
                        int pad = width - raw.length()
                        return colored + (' ' * pad)
                    }
                    def headerCell = { String label, int width ->
                        label.length() >= width ? label.substring(0,width) : label + (' ' * (width - label.length()))
                    }

                    // Header (no color in header cells)
                    println "  " + "File".padRight(fileWidth) + " | " +
                            headerCell('P1', metricWidth) + " | " +
                            headerCell('P2', metricWidth) + " | " +
                            //headerCell('P3', metricWidth) + " | " +
                            headerCell('Total', metricWidth)
                    println "-" * 120

                    def sortedFiles = codenarcData.fileViolations.sort { -it.value.total }
                    sortedFiles.each { filePath, violations ->
                        def fileName = filePath.contains('/') ? filePath.substring(filePath.lastIndexOf('/') + 1) : filePath
                        if (fileName.length() > fileWidth) {
                            fileName = fileName.substring(0, fileWidth - 3) + '...'
                        }
                        def p1Cell = formatMetric(violations.priority1, metricWidth, violations.priority1 > 0 ? colors.RED : null)
                        def p2Cell = formatMetric(violations.priority2, metricWidth, violations.priority2 > 0 ? colors.ORANGE : null)
                        //def p3Cell = formatMetric(violations.priority3, metricWidth, violations.priority3 > 0 ? colors.YELLOW : null)
                        //def totalCell = formatMetric(violations.total,  metricWidth, violations.total > 0 ? null : null, violations.total > 0)
                        def totalCell = formatMetric(violations.priority1 + violations.priority2,  metricWidth, null, violations.priority1 + violations.priority2 > 0)


                        //println "  " + fileName.padRight(fileWidth) + " | " + p1Cell + " | " + p2Cell + " | " + p3Cell + " | " + totalCell
                        println "  " + fileName.padRight(fileWidth) + " | " + p1Cell + " | " + p2Cell +  " | " + totalCell

                    }
                }
            } else {
                println "  Status:                  ${colors.BOLD}${colors.GREEN}NO VIOLATIONS FOUND${colors.RESET}"
            }
        } else {
            println "  Status:                  ${colors.YELLOW}REPORT AVAILABLE (detailed parsing unavailable)${colors.RESET}"
        }
        println "=" * 120
        println ""
    }

    return codenarcData
}

/**
 * Parses test results from XML files in the specified directory
 */
def parseTestResultsFromDir = { dirPath, testType ->
    def testDir = file(dirPath)
    def results = [total: 0, passed: 0, failed: 0, skipped: 0, time: 0.0, classes: 0]
    if (testDir.exists()) {
        testDir.listFiles().findAll { it.name.startsWith('TEST-') && it.name.endsWith('.xml') }.each { xmlFile ->
            results.classes++
            def testsuite = new XmlSlurper().parse(xmlFile)
            def tests = (testsuite.@tests.toString() ?: "0") as Integer
            def failures = (testsuite.@failures.toString() ?: "0") as Integer
            def errors = (testsuite.@errors.toString() ?: "0") as Integer
            def skipped = (testsuite.@skipped.toString() ?: "0") as Integer
            def time = (testsuite.@time.toString() ?: "0.0") as Double
            results.total += tests
            results.failed += failures + errors
            results.skipped += skipped
            results.time += time
        }
        results.passed = results.total - results.failed - results.skipped
    }
    return results
}

/**
 * Displays comprehensive test results summary
 */
def displayTestResultsSummary = { unitTestResults, integrationTestResults ->
    def total = [total: 0, passed: 0, failed: 0, skipped: 0, time: 0.0, classes: 0]

    [unitTestResults, integrationTestResults].each { r ->
        total.total += r.total
        total.passed += r.passed
        total.failed += r.failed
        total.skipped += r.skipped
        total.time += r.time
        total.classes += r.classes
    }

    println String.format("%-18s | %7s | %7s | %7s | %7s | %8s | %8s",
        "Type", "Total", "Passed", "Failed", "Skipped", "Classes", "Time(s)")
    println "------------------+---------+---------+---------+---------+----------+----------"
    println String.format("%-18s | %7d | %7d | %7d | %7d | %8d | %8.2f",
        "Unit Tests", unitTestResults.total, unitTestResults.passed, unitTestResults.failed,
        unitTestResults.skipped, unitTestResults.classes, unitTestResults.time)
    println String.format("%-18s | %7d | %7d | %7d | %7d | %8d | %8.2f",
        "Integration Tests", integrationTestResults.total, integrationTestResults.passed,
        integrationTestResults.failed, integrationTestResults.skipped, integrationTestResults.classes, integrationTestResults.time)
    println String.format("%-18s | %7d | %7d | %7d | %7d | %8d | %8.2f",
        "TOTAL", total.total, total.passed, total.failed, total.skipped, total.classes, total.time)

    return total
}

