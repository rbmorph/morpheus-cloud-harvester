name: Build and release

# Runs when a tag is pushed (for example v1.2.0): runs all the tests, builds the plugin jar and
# publishes it as a GitHub release. Can also be started by hand from the Actions tab (jar kept as an
# artifact, no release).
on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set the version from the tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0-SNAPSHOT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION}"

      - name: Run the tests and build the plugin jar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean test shadowJar -Pversion="${{ steps.version.outputs.version }}"

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

      - name: Upload the plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: build/libs/*-all.jar

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*-all.jar
          generate_release_notes: true
